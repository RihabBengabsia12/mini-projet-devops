version: '3.8'

services:
  db:
    image: postgres:13
    container_name: user-service-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: RihabDB
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  user-service:
    build: .
    container_name: user-service-app
    env_file: .env
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  postgres-data:

